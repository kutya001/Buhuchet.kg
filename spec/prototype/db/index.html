    <h3>Связи</h3><div class="rel"><div class="cap">Ссылается на · ${outs.length}</div><div class="chips">${chips(outs)}</div><div class="cap">На неё ссылаются · ${ins.length}</div><div class="chips">${chips(ins)}</div></div>
    ${t.logic&&t.logic.length?`<h3>Бизнес-логика</h3><ul class="list">${t.logic.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    <h3>Защита строк (RLS)</h3><p style="margin:0">${esc(t.rls)}</p>
    ${EMB?`<h3>Где используется в API · ${(API_T[t.name]||[]).length}</h3>${apiUse(t.name,1)}`:''}
    ${t.uniques&&t.uniques.length?`<h3>Уникальность</h3><ul class="list">${t.uniques.map(x=>`<li><code>${esc(x)}</code></li>`).join('')}</ul>`:''}
    ${t.indexes&&t.indexes.length?`<h3>Индексы</h3><ul class="list">${t.indexes.map(x=>`<li><code>${esc(x)}</code></li>`).join('')}</ul>`:''}
  </div>`;
  const opening=box.hidden;
  if(opening)keepStage(()=>{box.hidden=false});
  box.scrollTop=keepScroll;
  if(col){
    const f=box.querySelector(`[data-ifc="${col}"]`);
    if(f){box.scrollTop=Math.max(0,f.offsetTop-box.querySelector('.ins-h').offsetHeight-12);f.classList.add('flash');setTimeout(()=>f.classList.remove('flash'),1600)}
    flashRow(n,col);
  }
  if(opening&&!quiet&&isPhone()&&E.nodes.has(n))setTimeout(()=>ensureVisible([n]),30);
}
function closeIns(){const box=$('#eins');if(box.hidden)return;keepStage(()=>{box.hidden=true;box.classList.remove('tall')});E.ins=null}
function focusTable(x,near){
  if(!E.nodes.has(x))showNodes([x],near&&E.nodes.has(near)?near:null);
  select(x);inspect(x,null,true);center(x);
}
$('#eins').addEventListener('click',e=>{
  const n=E.ins;if(!n)return;
  if(e.target.closest('#ins-close')){closeIns();select(null);return}
  if(e.target.closest('#ins-tall')){$('#eins').classList.toggle('tall');return}
  const en=e.target.closest('[data-enum]');if(en){go('#/e/'+en.dataset.enum);return}
  const s=e.target.closest('[data-isel]');if(s){focusTable(s.dataset.isel,n);return}
  const a=e.target.closest('[data-iact]');
  if(a){const k=a.dataset.iact;
    if(k==='full')go('#/t/'+n);
    else if(k==='focus')go('#/d/='+n);
    else if(k==='more'){showNodes(links(n).filter(x=>!E.nodes.has(x)),n);inspect(n)}
    else if(k==='hide'){hideNodes([n],true);inspect(n)}
    else if(k==='show'){focusTable(n)}
    return}
  if(e.target.closest('summary,button,a'))return;
  const f=e.target.closest('[data-ifc]');if(f&&E.nodes.has(n)){if(modeOf(n)!=='all'&&!E.nodes.get(n).rows.has(f.dataset.ifc))setMode(n,'all');flashRow(n,f.dataset.ifc)}
});

/* ─── список таблиц и легенда ─── */
function renderSide(){
  if(!$('#erd').classList.contains('side-open'))return;
  let h='';
  DB.groups.forEach(g=>{
    const ts=DB.tables.filter(t=>t.group===g.id&&matchTable(t,E.q).ok);if(!ts.length)return;
    const on=ts.filter(t=>E.shown.has(t.name)).length;
    h+=`<label class="es-gh"><input type="checkbox" data-sg="${g.id}"${on===ts.length?' checked':''} data-mixed="${on>0&&on<ts.length}"><span class="dot" style="background:${g.color}"></span><b>${esc(g.ru)}</b><span class="faint">${on}/${ts.length}</span></label>`;
    h+=ts.map(t=>`<div class="si${E.sel===t.name?' cur':''}" data-row="${t.name}"><input type="checkbox" data-si="${t.name}"${E.shown.has(t.name)?' checked':''} aria-label="Показать на схеме: ${esc(t.ru)}"><button type="button" class="sl" data-sf="${t.name}"><span class="sl1">${esc(t.ru)}${t.status==='actual'?'<span class="nst" title="Уже есть в базе"></span>':''}</span><code>${esc(t.name)}</code></button></div>`).join('');
  });
  $('#es-list').innerHTML=h||'<div class="empty">Ничего не найдено</div>';
  $('#es-list').querySelectorAll('[data-mixed="true"]').forEach(i=>{i.indeterminate=true});
  $('#es-cnt').textContent=`на схеме ${E.nodes.size} из ${DB.tables.length}`;
}
function renderLegend(){
  const lg=$('#lgd'),b=$('#lgd-b');let h='';
  if(EO.color==='status'){
    $('#lgd-t').textContent='Цвет: готовность';
    const cnt=s=>[...E.nodes.keys()].filter(n=>TBL.get(n).status===s).length;
    h=[['actual','--st-act'],['planned','--st-plan']].map(([s,v])=>`<button type="button" class="li" data-ls="${s}" title="${esc(DB.meta.statuses[s].desc)} Полоса слева у поля готовой таблицы: зелёная — поле уже в базе, серая — спроектировано."><span class="sw2" style="background:var(${v})"></span>${esc(DB.meta.statuses[s].ru)}<span class="n">${cnt(s)}</span></button>`).join('');
  }else{
    $('#lgd-t').textContent='Цвет: группы';
    const bb=groupBoxes();
    h=DB.groups.filter(g=>bb.has(g.id)).map(g=>`<button type="button" class="li" data-lg="${g.id}" title="Показать таблицы группы"><span class="sw2" style="background:${g.color}"></span>${esc(g.ru)}<span class="n">${bb.get(g.id).n}</span></button>`).join('');
  }
  b.innerHTML=h;
}
function lgdOpen(on){$('#lgd').classList.toggle('closed',!on);$('#lgd-t').setAttribute('aria-expanded',String(on))}
$('#lgd-t').onclick=()=>lgdOpen($('#lgd').classList.contains('closed'));
$('#lgd-b').addEventListener('click',e=>{
  const g=e.target.closest('[data-lg]'),s=e.target.closest('[data-ls]');
  const names=g?[...E.nodes.keys()].filter(n=>TBL.get(n).group===g.dataset.lg):s?[...E.nodes.keys()].filter(n=>TBL.get(n).status===s.dataset.ls):null;
  if(names&&names.length){select(null);fit(true,names,1)}
});
function sideOpen(on,init){
  keepStage(()=>{$('#erd').classList.toggle('side-open',on);$('#d-side').setAttribute('aria-pressed',String(on))});
  if(!init&&!isPhone()){EO.side=on;saveOpts()}
  if(on)renderSide();
  miniSoon();
}
$('#es-list').addEventListener('change',e=>{
  const i=e.target.closest('[data-si]'),g=e.target.closest('[data-sg]');
  if(i){i.checked?showNodes([i.dataset.si],E.sel):hideNodes([i.dataset.si])}
  else if(g){const ts=DB.tables.filter(t=>t.group===g.dataset.sg&&matchTable(t,E.q).ok).map(t=>t.name);g.checked?showNodes(ts):hideNodes(ts)}
});
$('#es-list').addEventListener('click',e=>{const b=e.target.closest('[data-sf]');if(!b)return;if(isPhone())sideOpen(false);focusTable(b.dataset.sf,E.sel)});
let esT=0;$('#es-q').addEventListener('input',e=>{clearTimeout(esT);esT=setTimeout(()=>{E.q=e.target.value.trim().toLowerCase();renderSide()},120)});
$('#es-close').onclick=()=>sideOpen(false);
$('#es-reset').onclick=()=>{dropState(E.view);E.sel=null;closeIns();renderErd(E.view)};

/* ─── панель над холстом ─── */
function initErd(){
  const o=DB.groups.map(g=>`<option value="${g.id}">${esc(g.ru)} · ${DB.tables.filter(t=>t.group===g.id).length}</option>`).join('');
  $('#d-what').innerHTML=`<optgroup label="Группа">${o}</optgroup><option value="all">Вся база · ${DB.tables.length} — все таблицы сразу</option><optgroup label="Таблица и её соседи" id="d-focus"></optgroup>${EMB?'<optgroup label="Таблицы метода API" id="d-mth"></optgroup>':''}`;
  $('#d-what').onchange=()=>go('#/d/'+encodeURIComponent($('#d-what').value));
  if(EMB&&EMB.api){const by={};Object.entries(API_M).forEach(([id,m])=>{(by[m.g]=by[m.g]||[]).push([id,m])});
    $('#d-api').innerHTML='<option value="">Подсветить метод API…</option>'+Object.entries(by).sort((a,b)=>a[0].localeCompare(b[0],'ru')).map(([g,l])=>`<optgroup label="${esc(g)}">${l.sort((a,b)=>a[1].p.localeCompare(b[1].p)||a[1].m.localeCompare(b[1].m)).map(([id,m])=>`<option value="${esc(id)}">${esc(m.m+' '+m.p)}</option>`).join('')}</optgroup>`).join('');
    $('#d-api-w').hidden=false;$('#d-api').onchange=e=>hlSet(e.target.value)}
  $('#d-cols').value=EO.cols;$('#d-color').value=EO.color;$('#d-desc').checked=EO.desc;$('#d-std').checked=EO.std;
  const seg=()=>document.querySelectorAll('[data-lbl]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lbl===EO.lbl)));seg();
  $('#d-cols').onchange=e=>{EO.cols=e.target.value;saveOpts();E.shown.forEach(n=>{E.st.modes[n]=EO.cols});saveState();renderErd(E.view,{keep:true})};
  $('#d-color').onchange=e=>{EO.color=e.target.value;saveOpts();renderErd(E.view,{keep:true,fitAfter:false})};
  document.querySelectorAll('[data-lbl]').forEach(b=>b.onclick=()=>{EO.lbl=b.dataset.lbl;saveOpts();seg();renderErd(E.view,{keep:true,fitAfter:false})});
  $('#d-desc').onchange=e=>{EO.desc=e.target.checked;saveOpts();renderErd(E.view,{keep:true})};
  $('#d-std').onchange=e=>{EO.std=e.target.checked;saveOpts();renderErd(E.view,{keep:true,fitAfter:false})};
  $('#d-relayout').onclick=()=>{E.st.pins={};saveState();renderErd(E.view,{keep:true});if(isPhone())optsOpen(false)};
  $('#d-side').onclick=()=>sideOpen(!$('#erd').classList.contains('side-open'));
  $('#d-optbtn').onclick=()=>optsOpen(!$('#d-opts').classList.contains('open'));
  $('#d-full').onclick=()=>fullOpen(!$('#erd-wrap').classList.contains('full'));
  $('#d-hint').textContent=isPhone()?'Нажмите на таблицу или поле — снизу откроется описание. Таблицу двигают за заголовок.'
    :'Перетаскивайте таблицы мышью, рамку группы — за заголовок, холст — за пустое место; колесо — масштаб. Нажмите на таблицу или поле — справа откроется описание; двойное нажатие на заголовок сворачивает таблицу. Расположение запоминается в этом браузере.';
  lgdOpen(!isPhone());
  sideOpen(isPhone()?false:(EO.side??innerWidth>=1280),true);
}
function optsOpen(on){$('#d-opts').classList.toggle('open',on);$('#d-optbtn').setAttribute('aria-expanded',String(on))}
function fullOpen(on,quiet){
  keepStage(()=>{$('#erd-wrap').classList.toggle('full',on);const b=$('#d-full');b.setAttribute('aria-pressed',String(on));b.querySelector('span').textContent=on?'Обычный вид':'На весь экран';b.title=on?'Вернуться к обычному виду (Esc)':'На весь экран'});
  document.body.style.overflow=on?'hidden':'';miniSoon();
  // в Админке схема на весь экран — это и рамка на всё окно программы; выход из схемы выводит и из него, если вход был отсюда
  if(EMB&&!quiet){if(on&&!EFULL){EFULL_ERD=true;toHost({full:true})}else if(!on&&EFULL&&EFULL_ERD){EFULL_ERD=false;toHost({full:false})}}
}
// полноэкранный режим Админки (рамка со схемой на всё окно)
let EFULL=false,EFULL_ERD=false;
function embFull(on){EFULL=on;const b=$('#emb-full');if(b){b.setAttribute('aria-pressed',String(on));b.querySelector('span').textContent=on?'Обычный вид':'На весь экран';b.title=on?'Вернуться к обычному виду (Esc)':'На весь экран: Esc — обычный вид'}
  if(!on){EFULL_ERD=false;if($('#erd-wrap').classList.contains('full'))fullOpen(false,true)}
  setTimeout(()=>{if(DB&&!$('#tab-d').hidden)fit(false)},60)}
if(EMB)$('#emb-full').onclick=()=>toHost({full:!EFULL});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(!$('#tab-d').hidden){
    if($('#d-opts').classList.contains('open')){optsOpen(false);return}
    if(E.ins){closeIns();select(null);return}
    if($('#erd-wrap').classList.contains('full')){fullOpen(false);return}
  }
  // в Админке необработанный Esc уходит программе: закрыть окно поверх схемы или выйти из полноэкранного режима
  if(EMB)toHost({esc:1});
});
document.addEventListener('pointerdown',e=>{if($('#d-opts').classList.contains('open')&&!e.target.closest('#d-opts,#d-optbtn'))optsOpen(false)});
addEventListener('resize',()=>{if(DB)miniSoon()});

/* ═════════════ Перечисления и правила ═════════════ */
function renderEnums(){
  const used=new Map();DB.tables.forEach(t=>t.columns.forEach(c=>{if(ENUM.has(c.type)){if(!used.has(c.type))used.set(c.type,[]);used.get(c.type).push({t,c})}}));
  $('#enums').innerHTML=DB.enums.map(e=>`<div class="box ecard" id="enum-${e.name}">
    <h2 style="margin:0">${esc(e.ru)}</h2><div class="en">${esc(e.name)}</div>${e.desc?`<div class="muted" style="font-size:13px;margin-top:4px">${esc(e.desc)}</div>`:''}
    <table>${e.values.map(v=>`<tr><td><code>${esc(v.v)}</code></td><td><b style="font-weight:600">${esc(v.ru)}</b>${v.desc?`<div class="muted" style="font-size:13px">${esc(v.desc)}</div>`:''}</td></tr>`).join('')}</table>
    <div class="used">Где используется: ${(used.get(e.name)||[]).map(({t,c})=>`<button type="button" class="lnk" data-go="${t.name}">${esc(t.ru)}</button> <code>${esc(c.name)}</code>`).join(', ')||'—'}</div></div>`).join('');
  $('#enums').onclick=e=>{const b=e.target.closest('[data-go]');if(b)go('#/t/'+b.dataset.go)};
}
function renderRules(){
  const m=DB.meta;
  $('#rules').innerHTML=`
  <div class="box"><h2>Общие правила базы</h2><ul class="list">${m.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>
  ${(DB.functions||[]).length?`<div class="box"><h2>Функции базы</h2><p class="muted" style="margin:0 0 10px">Функции в схеме app, которые вызывает приложение. Метка SECURITY DEFINER — функция работает с правами владельца схемы и обходит RLS, поэтому отдаёт только узко нужное.</p><div class="fns">${DB.functions.map(f=>`<div class="fn" id="fn-${esc(f.name.replace(/\(.*$/,'').replace(/^app\./,''))}"><code>${esc(f.name)}</code><div><b style="font-weight:600">${esc(f.ru)}</b>${f.definer?' <span class="badge b-fk">SECURITY DEFINER</span>':''} <span class="faint" style="font-size:12px">${esc(f.migration)}</span><div class="muted" style="font-size:14px">${esc(f.desc)}</div></div></div>`).join('')}</div></div>`:''}
  <div class="box"><h2>Как читать</h2><div class="legend">
    ${statusBadge('actual')}<span>${esc(m.statuses.actual.desc)}</span>
    ${statusBadge('planned')}<span>${esc(m.statuses.planned.desc)}</span>
    <span class="badge b-pk">PK</span><span>Первичный ключ: по нему находят запись. Если PK у нескольких полей — ключ составной.</span>
    <span class="badge b-fk">FK</span><span>Внешний ключ: ссылка на запись другой таблицы (в описании поля — куда и что будет при удалении).</span>
    <span class="badge b-uq">UQ</span><span>Значение не повторяется в таблице.</span>
    <span class="badge b-null">NULL</span><span>Поле может быть пустым. Без этой метки поле обязательно.</span>
    <span class="badge b-issue">#3</span><span>Задача в репозитории продукта или поток разработки, где таблица появится.</span>
  </div>
  <p class="muted" style="margin:12px 0 0">На схеме линия соединяет поле-ссылку с таблицей, на которую оно ссылается. У поля-ссылки «лапка» значит, что таких записей может быть много, черта — не больше одной. У таблицы, на которую ссылаются, две черты — ссылка обязательна (ровно одна запись), черта с кружком — поле может быть пустым (одна запись или ни одной). Зелёная точка в заголовке таблицы — таблица уже есть в базе.</p></div>
  <div class="box"><h2>Типы данных</h2><div class="types">${Object.entries(DB.types).map(([k,v])=>`<code>${esc(k)}</code><span>${esc(v)}</span>`).join('')}</div></div>
  <div class="box"><h2>Откуда это описание</h2><ul class="list">${m.sources.map(s=>`<li><b>${esc(s.name)}</b> <span class="muted">(${esc(s.ref)})</span> — ${esc(s.what)}</li>`).join('')}</ul></div>
  <div class="box"><h2>Как поддерживается</h2><ul class="list">${m.maintain.map(r=>`<li>${esc(r)}</li>`).join('')}</ul><p class="faint" style="margin:10px 0 0;font-size:13px">Версия описания ${esc(m.schemaVersion)} от ${fmtDate(m.updated)}.</p></div>`;
}

/* ═════════════ Тема ═════════════ */
const THEMES=['auto','light','dark'],THEME_RU={auto:'как в устройстве',light:'светлая',dark:'тёмная'};
let theme='auto';try{theme=localStorage.getItem('db-theme')||'auto'}catch(e){}
if(EMB)theme=EMB.theme||'auto';
function themeNow(){return theme==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):theme}
function applyTheme(){
  if(theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',theme);
  $('#theme').title='Тема: '+THEME_RU[theme];
  if(DB)miniSoon();
}
$('#theme').onclick=()=>{theme=THEMES[(THEMES.indexOf(theme)+1)%3];try{localStorage.setItem('db-theme',theme)}catch(e){}applyTheme()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(theme==='auto')applyTheme()});
applyTheme();
addEventListener('resize',()=>{if(!isPhone())document.body.style.overflow=''});
// Команды прототипа: тема, переход по адресу страницы (#/t/таблица, #/d/@метод), подсветка метода на схеме
if(EMB)addEventListener('message',e=>{if(e.source!==parent||!e.data||!e.data.tdx)return;const d=e.data;
  if(d.theme){theme=d.theme;applyTheme()}
  if(d.go){go(d.go,true)}
  if(d.hl!=null)hlSet(d.hl);
  if('full' in d)embFull(!!d.full)});
load();
if(EMB){const fixTop=()=>document.documentElement.style.setProperty('--top',document.querySelector('header').offsetHeight+'px');fixTop();addEventListener('resize',fixTop);toHost({ready:1})}
</script>
</body>
</html>
