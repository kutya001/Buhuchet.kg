name: Release production

# Выпуск на рабочий сайт buhuchet.kg — только по команде заказчика «выпускай» (docs/deploy.md, раздел
# «Рабочий сайт»). Запуск: Actions → Release production → Run workflow, ветка main. Оба задания ждут
# одобрения окружения `production` (Settings → Environments: Required reviewers — заказчик, Deployment
# branches — main): первое — перед миграциями, второе — когда первое закончилось; секреты рабочего сайта
# PRODUCTION_* есть только у этого окружения. По шагам:
# Задание release-migrate:
# 1. Выпускаемый коммит — из main, по нему зелёный полный CI (ночной прогон или ручной запуск CI на main),
#    и ветку production можно только сдвинуть вперёд на него (откат версии — Instant Rollback в Vercel).
# 2. Миграции рабочей базы и роль приложения, справочники без демо-организации, корзина файлов. Миграции
#    совместимы со старым кодом, поэтому они идут до выкладки.
# 3. По отметке — администратор платформы из секретов: пароль временный, в журнал не печатается, уже
#    созданного команда не трогает.
# Задание release-publish (после первого):
# 4. Метка версии release-<дата>-<время по Бишкеку> и перенос ветки production на коммит: Vercel (проект
#    buhuchet) сам собирает и выкладывает рабочий сайт. Ветку и метку пушит ключ развёртывания
#    PRODUCTION_DEPLOY_KEY (Settings → Deploy keys, с записью): правило (Ruleset) ветки production
#    пропускает только ключи развёртывания, поэтому ни сессии Claude Code, ни другие участники ветку не
#    сдвинут, а GITHUB_TOKEN не может сдвинуть её на коммиты, которые меняют .github/workflows.
# Два задания — чтобы ключ развёртывания не попал туда, где работает код зависимостей (pnpm install,
# миграции): такой код мог бы оставить git hook или прочитать ключ. Второе задание — на чистой машине, без
# pnpm install и Node.js, git hooks выключены; ключ получает только оно (docs/decisions.md п. О-40).
# Секреты передаются только в шаги, которым нужны, — не в установку зависимостей. Actions закреплены
# полным SHA (обновляет Dependabot, .github/dependabot.yml), кеша пакетов нет.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Коммит main для выпуска (пусто — последний коммит main)'
        type: string
        required: false
        default: ''
      create_admin:
        description: 'Создать администратора платформы PRODUCTION_ADMIN_LOGIN с временным паролем PRODUCTION_ADMIN_PASSWORD (уже созданного не трогает)'
        type: boolean
        default: false

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: release-migrate
    # Только код из main: ручной запуск с другой ветки ничего не делает.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      actions: read # зелёный CI по выпускаемому коммиту
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    env:
      APP_ENV: production
      S3_BUCKET: buhuchet
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - name: Секреты рабочего сайта заданы
        env:
          SET: >-
            ${{ secrets.PRODUCTION_DATABASE_ADMIN_URL != '' && secrets.PRODUCTION_DATABASE_URL != '' &&
            secrets.PRODUCTION_S3_ENDPOINT != '' && secrets.PRODUCTION_S3_REGION != '' &&
            secrets.PRODUCTION_S3_ACCESS_KEY_ID != '' && secrets.PRODUCTION_S3_SECRET_ACCESS_KEY != '' }}
          ADMIN_SET: ${{ secrets.PRODUCTION_ADMIN_LOGIN != '' && secrets.PRODUCTION_ADMIN_PASSWORD != '' }}
          CREATE_ADMIN: ${{ inputs.create_admin }}
        run: |
          if [ "$SET" != "true" ]; then
            echo "::error::Секреты окружения production заданы не все (docs/deploy.md, раздел «Рабочий сайт»)."
            exit 1
          fi
          if [ "$CREATE_ADMIN" = "true" ] && [ "$ADMIN_SET" != "true" ]; then
            echo "::error::Для отметки «Создать администратора» нужны секреты PRODUCTION_ADMIN_LOGIN и PRODUCTION_ADMIN_PASSWORD."
            exit 1
          fi

      - name: Выпускаемый коммит
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          want="$(printf '%s' "${INPUT_SHA:-$GITHUB_SHA}" | tr -d '[:space:]')"
          if ! [[ "$want" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Коммит — от 7 до 40 шестнадцатеричных символов."
            exit 1
          fi
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$want" --jq .sha)"
          # Коммит есть в main: main с ним совпадает или впереди.
          in_main="$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status)"
          if [ "$in_main" != identical ] && [ "$in_main" != ahead ]; then
            echo "::error::Коммит $sha не из main."
            exit 1
          fi
          # Ветку production можно только сдвинуть вперёд.
          forward="$(gh api "repos/$GITHUB_REPOSITORY/compare/production...$sha" --jq .status)"
          if [ "$forward" != identical ] && [ "$forward" != ahead ]; then
            echo "::error::Коммит $sha старше выпущенного (production). Откат версии — Instant Rollback в Vercel."
            exit 1
          fi
          # Ветка production защищена правилом (Ruleset): без него ключ развёртывания сдвинул бы её и без
          # выпуска, поэтому выпуск без правила не идёт.
          rules="$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/production" --jq '[.[].type] | join(" ")')"
          for need in update deletion non_fast_forward; do
            if [[ " $rules " != *" $need "* ]]; then
              echo "::error::У ветки production нет правила «$need» (Settings → Rules → Rulesets, docs/deploy.md)."
              exit 1
            fi
          done
          # Повтор проверок: полный CI по этому коммиту (ночной прогон или Actions → CI → Run workflow на main).
          green="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&status=success&per_page=1" --jq .total_count)"
          if [ "$green" -lt 1 ]; then
            echo "::error::По коммиту $sha нет зелёного CI. Запустите Actions → CI → Run workflow (ветка main), дождитесь зелёного и запустите выпуск снова."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Выпускается $sha"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile

      - name: Миграции и роль приложения
        run: pnpm db:migrate
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PRODUCTION_DATABASE_ADMIN_URL }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          # Корневой сертификат базы (текст PEM) — сертификат сервера проверяется; секрета нет — пустая
          # строка, соединение как в адресе (sslmode=require, docs/deploy.md).
          DATABASE_CA_CERT: ${{ secrets.PRODUCTION_DATABASE_CA_CERT }}

      - name: Справочники и ГКЭД (без демо-организации; изменившиеся разделы обновляются)
        run: pnpm db:seed --update
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PRODUCTION_DATABASE_ADMIN_URL }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.PRODUCTION_DATABASE_CA_CERT }}

      - name: Корзина файлов
        run: pnpm storage:init
        env:
          S3_ENDPOINT: ${{ secrets.PRODUCTION_S3_ENDPOINT }}
          S3_REGION: ${{ secrets.PRODUCTION_S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_S3_SECRET_ACCESS_KEY }}

      - name: Администратор платформы (пароль в журнал не печатается)
        if: inputs.create_admin
        run: pnpm db:create-admin --login "$ADMIN_LOGIN" --password-from-env
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PRODUCTION_DATABASE_ADMIN_URL }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.PRODUCTION_DATABASE_CA_CERT }}
          ADMIN_LOGIN: ${{ secrets.PRODUCTION_ADMIN_LOGIN }}
          ADMIN_TEMP_PASSWORD: ${{ secrets.PRODUCTION_ADMIN_PASSWORD }}

      - name: Итог первого задания
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          {
            echo "### Миграции рабочей базы применены"
            echo "- Коммит: \`$SHA\`."
            echo "- Дальше — задание release-publish: одобрите его (Review deployments → production → Approve), оно перенесёт ветку production."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: release-publish
    needs: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - name: Ключ развёртывания задан
        env:
          SET: ${{ secrets.PRODUCTION_DEPLOY_KEY != '' }}
        run: |
          if [ "$SET" != "true" ]; then
            echo "::error::Нет секрета PRODUCTION_DEPLOY_KEY в окружении production (docs/deploy.md, раздел «Рабочий сайт»). Миграции уже применены: задайте секрет и перезапустите это задание (Re-run failed jobs)."
            exit 1
          fi

      # Только git: без pnpm install, setup-node и кода из репозитория. Вся история — ветку production пушит
      # этот клон (из неполного клона GitHub может не принять).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.migrate.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Метка версии и ветка production
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
          SHA: ${{ needs.migrate.outputs.sha }}
          # git hooks выключены для всех команд git этого шага (core.hooksPath=/dev/null).
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
        run: |
          set -euo pipefail
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Первое задание не передало коммит."
            exit 1
          fi
          # Ещё раз: коммит из main (main с ним совпадает или впереди).
          in_main="$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...main" --jq .status)"
          if [ "$in_main" != identical ] && [ "$in_main" != ahead ]; then
            echo "::error::Коммит $SHA не из main."
            exit 1
          fi
          key="$RUNNER_TEMP/deploy_key"
          hosts="$RUNNER_TEMP/known_hosts"
          trap 'rm -f "$key"' EXIT
          install -m 600 /dev/null "$key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          # Ключи узла github.com — из метаданных GitHub, а не «доверять при первом подключении».
          gh api meta --jq '.ssh_keys[]' | sed 's/^/github.com /' > "$hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$hosts"
          tag="release-$(TZ=Asia/Bishkek date +%Y-%m-%d-%H%M)"
          git tag "$tag" "$SHA"
          # Без --force: GitHub откажет, если production не предок коммита; --atomic — метка и ветка вместе.
          git push --atomic "git@github.com:$GITHUB_REPOSITORY.git" "$SHA:refs/heads/production" "refs/tags/$tag"
          {
            echo "### Выпуск на рабочий сайт"
            echo "- Коммит: \`$SHA\`, метка \`$tag\`."
            echo "- Ветка production перенесена — Vercel (проект buhuchet) собирает и выкладывает рабочий сайт."
          } >> "$GITHUB_STEP_SUMMARY"
