name: PR policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

jobs:
  pr-policy:
    name: pr-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Правило берётся из main, чтобы PR не мог ослабить проверку сам себе.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: scripts
          persist-credentials: false
          path: base
      # Только для самого первого PR, пока в main ещё нет скрипта.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          persist-credentials: false
          path: head
      - name: Отчёт агентов-ревьюеров в описании PR
        run: |
          script=base/scripts/check-pr-policy.mjs
          [ -f "$script" ] || script=head/scripts/check-pr-policy.mjs
          node "$script"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
