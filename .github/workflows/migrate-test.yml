name: Migrate test

# Миграции, наполнение справочников и демо-организации и корзина файлов тестового стенда test.buhuchet.kg.
# Запускается: после автослияния PR в main, который меняет базу или данные spec/ (automerge.mjs вызывает
# workflow_dispatch — слияние токеном GITHUB_TOKEN не запускает push), при слиянии человеком
# (push в main; и когда меняется сам этот файл) и вручную (Actions → Migrate test → Run workflow, ветка main).
# Секреты — Settings → Secrets and variables → Actions, с приставкой TEST_ (docs/deploy.md);
# пока их нет, запуск пропускается. Секреты передаются только в шаги, которым нужны, — не в установку
# зависимостей. Actions закреплены полным SHA (обновляет Dependabot, .github/dependabot.yml).
on:
  workflow_dispatch:
    inputs:
      reset_admin_password:
        description: 'Сбросить пароль администратора платформы (TEST_ADMIN_LOGIN) на временный из TEST_ADMIN_PASSWORD'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'packages/db/**'
      - 'spec/data/**'
      - '.github/workflows/migrate-test.yml'

concurrency:
  group: migrate-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: migrate-test
    # Только код из main: ручной запуск с другой ветки ничего не делает.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_ENV: staging
      S3_BUCKET: buhuchet
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - name: Секреты стенда заданы
        id: ready
        env:
          SET: >-
            ${{ secrets.TEST_DATABASE_ADMIN_URL != '' && secrets.TEST_DATABASE_URL != '' &&
            secrets.TEST_S3_ENDPOINT != '' && secrets.TEST_S3_REGION != '' &&
            secrets.TEST_S3_ACCESS_KEY_ID != '' && secrets.TEST_S3_SECRET_ACCESS_KEY != '' }}
        run: |
          if [ "$SET" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Секреты TEST_* заданы не все (docs/deploy.md) — миграции стенда пропущены."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ready.outputs.ok == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.ready.outputs.ok == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.ready.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - name: Миграции и роль приложения
        if: steps.ready.outputs.ok == 'true'
        run: pnpm db:migrate
        env:
          DATABASE_ADMIN_URL: ${{ secrets.TEST_DATABASE_ADMIN_URL }}
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          # Корневой сертификат базы (текст PEM): с ним сертификат сервера проверяется (Р-14, читает config);
          # секрета нет — пустая строка, соединение как в адресе (sslmode=require, docs/deploy.md).
          DATABASE_CA_CERT: ${{ secrets.TEST_DATABASE_CA_CERT }}
      - name: Справочники, ГКЭД и демо-организация (изменившиеся разделы обновляются)
        if: steps.ready.outputs.ok == 'true'
        run: pnpm db:seed --update ${RESET_ADMIN_PASSWORD:+--reset-admin-password}
        env:
          DATABASE_ADMIN_URL: ${{ secrets.TEST_DATABASE_ADMIN_URL }}
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.TEST_DATABASE_CA_CERT }}
          # Пароль демо-сотрудников (erkin, meerim…). Секрета нет — пустая строка значит «не задано»:
          # наполнение идёт, пароль демо-сотрудников не меняется (пока он ни разу не задан, войти нельзя).
          DEMO_PASSWORD: ${{ secrets.TEST_DEMO_PASSWORD }}
          # Администратор платформы: создаётся, если его нет, с временным паролем (сменить при первом
          # входе); уже созданного наполнение не трогает. Без секретов — не создаётся.
          PLATFORM_ADMIN_LOGIN: ${{ secrets.TEST_ADMIN_LOGIN }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          # Забытый пароль: ручной запуск (Actions → Migrate test → Run workflow) с отметкой «Сбросить
          # пароль администратора» снова делает пароль администратора TEST_ADMIN_LOGIN временным из
          # TEST_ADMIN_PASSWORD и завершает его сеансы. Запуск после слияния PR отметки не ставит.
          RESET_ADMIN_PASSWORD: ${{ inputs.reset_admin_password && '1' || '' }}
      - name: Корзина файлов
        if: steps.ready.outputs.ok == 'true'
        run: pnpm storage:init
        env:
          S3_ENDPOINT: ${{ secrets.TEST_S3_ENDPOINT }}
          S3_REGION: ${{ secrets.TEST_S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.TEST_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.TEST_S3_SECRET_ACCESS_KEY }}
