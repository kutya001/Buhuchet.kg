packages:
  - apps/*
  - packages/*

# Общие версии зависимостей: в package.json пакетов пишется "catalog:"
catalog:
  zod: ^4.6.7
  hono: ^4.13.14
  '@hono/zod-openapi': ^1.6.3
  '@hono/node-server': ^2.1.5
  drizzle-orm: ^0.45.4
  drizzle-kit: ^0.31.11
  postgres: ^3.4.9
  pino: ^10.4.0
  vitest: ^5.0.5
  '@vitest/coverage-v8': ^5.0.5
  tsx: ^4.23.15
  tsup: ^9.0.0
  '@types/node': ^22.19.0
  typescript: ~5.9.3

onlyBuiltDependencies:
  - esbuild
  - sharp
  - '@tailwindcss/oxide'

# Сценарий после установки tesseract.js — только приглашение поддержать проект: не запускается.
ignoredBuiltDependencies:
  - tesseract.js
