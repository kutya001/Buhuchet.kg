# Buhuchet.kg на своём VPS (см. docs/migration-vps.md). Переменные — в файле .env рядом (не в репозитории).
#   docker compose -f docker-compose.prod.yml up -d --build
name: buhuchet-prod

x-app-env: &app-env
  APP_ENV: production
  APP_VERSION: ${APP_VERSION}
  APP_BASE_URL: https://${DOMAIN:?задайте DOMAIN}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${DB_APP_USER:?задайте DB_APP_USER}:${DB_APP_PASSWORD:?задайте DB_APP_PASSWORD}@postgres:5432/buhuchet
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-buhuchet}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?задайте S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?задайте S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: 'true'
  CRON_SECRET: ${CRON_SECRET:?задайте CRON_SECRET}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?задайте DB_ADMIN_PASSWORD}
      POSTGRES_DB: buhuchet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d buhuchet']
      interval: 5s
      retries: 30

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      retries: 30

  # Пароль владельца базы — только здесь: web и worker работают ролью приложения без обхода RLS.
  migrate:
    build: { context: ., target: tools }
    environment:
      <<: *app-env
      DATABASE_ADMIN_URL: postgres://postgres:${DB_ADMIN_PASSWORD:?задайте DB_ADMIN_PASSWORD}@postgres:5432/buhuchet
    command: ['sh', '-c', 'pnpm db:migrate && pnpm db:seed && pnpm storage:init']
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      retries: 30

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - web

volumes:
  pgdata:
  miniodata:
  caddydata:
